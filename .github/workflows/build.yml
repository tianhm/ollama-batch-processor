name: Build binaries

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the binaries to (leave empty to only keep artifacts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-22.04,   name: linux }
          - { os: macos-latest,   name: macos }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          fi

      - name: Build with PyInstaller
        run: python build.py

      - name: Smoke-test the frozen build (Linux, real Ollama run with a tiny model)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/frozen && tar xzf dist/*.tar.gz -C /tmp/frozen
          printf 'The old lighthouse keeper climbed the stairs every evening. He had done so for forty years. %.0s' $(seq 1 12) > /tmp/chapter.txt
          # try to bring up a real server; the self-test also passes (in "unreachable" mode) if this fails
          if curl -fsSL https://ollama.com/install.sh | sh; then
            (ollama serve > /tmp/ollama.log 2>&1 &)
            for i in $(seq 1 30); do curl -fs http://localhost:11434/api/version && break; sleep 1; done
            timeout 600 ollama pull qwen2.5:0.5b || true
          fi
          QT_QPA_PLATFORM=offscreen OLLAMA_BATCH_SELFTEST=/tmp/chapter.txt timeout 900 /tmp/frozen/*/ollama-batch-processor
          ls -la /tmp/ && (head -c 400 /tmp/chapter_selftest.txt || true)

      - uses: actions/upload-artifact@v4
        with:
          name: ollama-batch-processor-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
